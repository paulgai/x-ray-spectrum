<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kVp και mAs Sliders</title>
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- image-js -->
    <script src="https://cdn.jsdelivr.net/npm/@image-js/core/dist/image.min.js"></script>
    <style>
                body { background-color: #f8f9fa; font-family: 'Roboto', sans-serif; }
                .navbar-brand, .card-title { font-weight: 500; }
                .card-title { text-align: center; }
                .card-body { max-width: 550px; margin: 0 auto; } font-weight: 500; }
                .slider-label { font-weight: 600; /* Removed bottom margin for inline labels */ }
                .form-range { width: 300px; height: 8px; background: #e9ecef; border-radius: 5px; -webkit-appearance: none; }
                .form-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #0d6efd; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.3); margin-top: -6px; }
                .form-range::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #0d6efd; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.3); }
                /* Center slider groups */
                .slider-group {
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 30px;
                gap: 1rem;
            }
                .chart-container { width: 500px; max-width: 100%; margin: 0 auto 2rem; }
                .canvas-container { width: 500px; max-width: 100%; margin: 0 auto 2rem; }
                #imageCanvas { width: 100% !important; height: auto !important; display: block; border: 1px solid #ddd; border-radius: 4px; }
                /* Footer πάντα κάτω, αλλά όχι fixed */
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      footer {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h1 class="card-title mb-4">Ρυθμίσεις kVp και mAs</h1>
              <!-- KVp Slider -->
              <div class="slider-group">
                <div class="slider-label">kVp</div>
                <div class="d-flex align-items-center">
                  <input
                    type="range"
                    id="kvpSlider"
                    class="form-range me-3"
                    min="20"
                    max="170"
                    value="90"
                    oninput="updateAll()"
                  />
                  <span id="kvpValue" class="fw-bold">90</span>
                </div>
              </div>

              <!-- mAs Slider -->
              <div class="slider-group">
                <div class="slider-label">mAs</div>
                <div class="d-flex align-items-center">
                  <input
                    type="range"
                    id="masSlider"
                    class="form-range me-3"
                    min="0.1"
                    max="20"
                    value="5"
                    step="0.1"
                    oninput="updateAll()"
                  />
                  <span id="masValue" class="fw-bold">16</span>
                </div>
              </div>

              <!-- Chart -->
              <div class="chart-container">
                <canvas id="functionChart"></canvas>
              </div>

              <!-- Image -->
              <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Πάρε το footer και βάλε το αμέσως πριν το τέλος του </body> -->
    <footer class="text-end py-2 px-3 bg-transparent">
      <small style="color: #adb5bd; font-size: 0.75rem">
        © Belistou Maria-Stavroula, Gaintatzis Pavlos 2025
      </small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Constants
      const a = 6;
      const ka = 15;
      const kb = 10;
      const s = 0.3;

      let originalImage, functionChart;

      async function loadImage() {
        const img = await fetch("1.jpg")
          .then((r) => r.blob())
          .then((b) => createImageBitmap(b));
        const canvas = document.getElementById("imageCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }

      function updateLabel(id, value, decimals = 0) {
        document.getElementById(id).textContent =
          parseFloat(value).toFixed(decimals);
      }

      /* ---------------------------------------------------------------
   ΠΑΡΑΜΕΤΡΟΙ ΠΟΥ ΡΥΘΜΙΖΕΙΣ ΕΥΚΟΛΑ
----------------------------------------------------------------*/
      const CONTRAST_MIN = 0; // ελάχιστο contrast (200 kV)
      const CONTRAST_MAX = 2; // μέγιστο contrast  (15 kV)

      const BRIGHTNESS_MIN = 0.0; // ελάχιστη φωτεινότητα (200 kV)
      const BRIGHTNESS_MAX = 2.0; // μέγιστη φωτεινότητα  (15 kV)
      const KVP_NEUTRAL = 120; // ήταν 110
      /* ===============================================================
   updateImageProcessing
================================================================*/
      function updateImageProcessing() {
        if (!originalImage) return;

        /* 1. Τρέχουσες τιμές sliders */
        const mAs = +document.getElementById("masSlider").value;
        const kVp = +document.getElementById("kvpSlider").value;

        /* 2. Φωτεινότητα από mAs  (0.3→4, 3.2→1, 10→0) */
        const B_mAs = (() => {
          if (mAs <= 0.3) return 4;
          if (mAs >= 10) return 0;
          if (mAs < 3.2) return 1 + ((3.2 - mAs) / (3.2 - 0.3)) * 3;
          return 1 - (mAs - 3.2) / (10 - 3.2);
        })();

        /* 3. Contrast & Brightness από kVp
       – κλάδος χαμηλού (15‑110 kV)  &  υψηλού (110‑200 kV)       */
        let A_kVp, B_kVp;

        /* --- contrast & brightness από kVp --- */
        if (kVp <= KVP_NEUTRAL) {
          const t = (KVP_NEUTRAL - kVp) / (KVP_NEUTRAL - 15); // 0…1
          B_kVp = 1 + t * (BRIGHTNESS_MAX - 1);
          A_kVp = 1 + t * (CONTRAST_MAX - 1);
        } else {
          const t = (kVp - KVP_NEUTRAL) / (200 - KVP_NEUTRAL); // 0…1
          B_kVp = 1 - t * (1 - BRIGHTNESS_MIN);
          A_kVp = 1 - t * (1 - CONTRAST_MIN);
        }

        /*  Clamp για σιγουριά */
        B_kVp = Math.max(BRIGHTNESS_MIN, Math.min(BRIGHTNESS_MAX, B_kVp));
        A_kVp = Math.max(CONTRAST_MIN, Math.min(CONTRAST_MAX, A_kVp));

        const lightenMode = kVp < KVP_NEUTRAL; // <110: μόνο «λεύκανση»

        /* 4. Προετοιμασία καμβά */
        const src = originalImage.data;
        const dst = new Uint8ClampedArray(src.length);

        for (let i = 0; i < src.length; i += 4) {
          /* βάση μόνο με mAs */
          const baseR = src[i] * B_mAs;
          const baseG = src[i + 1] * B_mAs;
          const baseB = src[i + 2] * B_mAs;

          /* contrast γύρω από 128 */
          let r = (baseR - 128) * A_kVp + 128;
          let g = (baseG - 128) * A_kVp + 128;
          let b = (baseB - 128) * A_kVp + 128;

          /* φωτεινότητα kVp */
          r *= B_kVp;
          g *= B_kVp;
          b *= B_kVp;

          /* clamp 0‑255 */
          r = Math.min(255, Math.max(0, r));
          g = Math.min(255, Math.max(0, g));
          b = Math.min(255, Math.max(0, b));

          /* τελικό pixel — μονόδρομη αλλαγή */
          dst[i] = lightenMode ? Math.max(baseR, r) : Math.min(baseR, r);
          dst[i + 1] = lightenMode ? Math.max(baseG, g) : Math.min(baseG, g);
          dst[i + 2] = lightenMode ? Math.max(baseB, b) : Math.min(baseB, b);
          dst[i + 3] = 255; // πλήρης αδιαφάνεια
        }

        /* 5. Εμφάνιση στον καμβά */
        const ctx = document.getElementById("imageCanvas").getContext("2d");
        ctx.putImageData(
          new ImageData(dst, originalImage.width, originalImage.height),
          0,
          0
        );
      }

      function computeData(kvp, mas) {
        const xs = [];
        const ys = [];
        const points = 500;
        for (let i = 0; i <= points; i++) {
          const x = i * (kvp / points);
          let y = 0;
          if (x > 0 && x < kvp) {
            const base = ((0.1 * mas * (kvp - x)) / x) * Math.exp(-a / x);
            const kaTerm =
              ((ka * 0.1 * mas * (kvp - 59.3)) / 59.3) *
              Math.exp(-a / 59.3) *
              Math.exp(-((x - 59.3) ** 2) / (2 * s * s));
            const kbTerm =
              ((kb * 0.1 * mas * (kvp - 67.2)) / 67.2) *
              Math.exp(-a / 67.2) *
              Math.exp(-((x - 67.2) ** 2) / (2 * s * s));
            y = base + kaTerm + kbTerm + 1;
          }
          xs.push(x);
          ys.push(y);
        }
        return { xs, ys };
      }

      function initChart() {
        const ctx = document.getElementById("functionChart").getContext("2d");
        functionChart = new Chart(ctx, {
          type: "line",
          data: {
            datasets: [
              {
                label: "",
                data: [],
                fill: false,
                tension: 0.4,
                pointRadius: 0,
              },
            ],
          },
          options: {
            responsive: true,
            animation: false,
            plugins: {
              title: {
                display: true,
                text: "Φάσμα ακτίνων X",
              },
              legend: { display: false },
            },
            scales: {
              x: {
                type: "linear",
                min: 0,
                max: 130,
                title: { display: true, text: "Ενέργεια (kV)" },
              },
              y: {
                type: "logarithmic", // λογαριθμική κλίμακα
                min: 1, // ≈“0” (πρέπει να είναι >0)
                max: 50, // σταθερό άνω όριο
                ticks: {
                  callback: (value) => value, // π.χ. δείξε «1, 2, 5, 10, 20, 50»
                  // αν θες να εμφανίζεται "0" στο 1:
                  // callback: value => value === 1 ? '0' : value,
                },
                title: { display: true, text: "Ένταση (αυθαίρετες μονάδες)" },
              },
            },
          },
        });
      }

      function updateChart() {
        const kvp = +document.getElementById("kvpSlider").value;
        const mas = +document.getElementById("masSlider").value;
        const data = computeData(kvp, mas);
        functionChart.data.datasets[0].data = data.xs.map((x, i) => ({
          x,
          y: data.ys[i],
        }));
        functionChart.update();
      }

      function updateAll() {
        updateLabel("kvpValue", document.getElementById("kvpSlider").value);
        updateLabel("masValue", document.getElementById("masSlider").value, 1);

        updateImageProcessing(); // ← κλήση της νέας συνάρτησης
        updateChart();
      }

      window.addEventListener("load", async () => {
        await loadImage();
        initChart();
        updateAll();
      });
    </script>
  </body>
</html>
