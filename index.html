<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KVp και mAs Sliders</title>
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- image-js -->
    <script src="https://cdn.jsdelivr.net/npm/@image-js/core/dist/image.min.js"></script>
    <style>
                body { background-color: #f8f9fa; font-family: 'Roboto', sans-serif; }
                .navbar-brand, .card-title { font-weight: 500; }
                .card-title { text-align: center; }
                .card-body { max-width: 550px; margin: 0 auto; } font-weight: 500; }
                .slider-label { font-weight: 600; /* Removed bottom margin for inline labels */ }
                .form-range { width: 300px; height: 8px; background: #e9ecef; border-radius: 5px; -webkit-appearance: none; }
                .form-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #0d6efd; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.3); margin-top: -6px; }
                .form-range::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #0d6efd; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.3); }
                /* Center slider groups */
                .slider-group {
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 30px;
                gap: 1rem;
            }
                .chart-container { width: 500px; max-width: 100%; margin: 0 auto 2rem; }
                .canvas-container { width: 500px; max-width: 100%; margin: 0 auto 2rem; }
                #imageCanvas { width: 100% !important; height: auto !important; display: block; border: 1px solid #ddd; border-radius: 4px; }
                /* Footer πάντα κάτω, αλλά όχι fixed */
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      footer {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow-sm">
            <div class="card-body text-center">
              <h1 class="card-title mb-4">Ρυθμίσεις KVp και mAs</h1>
              <!-- KVp Slider -->
              <div class="slider-group">
                <div class="slider-label">KVp</div>
                <div class="d-flex align-items-center">
                  <input
                    type="range"
                    id="kvpSlider"
                    class="form-range me-3"
                    min="50"
                    max="130"
                    value="90"
                    oninput="updateAll()"
                  />
                  <span id="kvpValue" class="fw-bold">90</span>
                </div>
              </div>

              <!-- mAs Slider -->
              <div class="slider-group">
                <div class="slider-label">mAs</div>
                <div class="d-flex align-items-center">
                  <input
                    type="range"
                    id="masSlider"
                    class="form-range me-3"
                    min="2"
                    max="30"
                    value="16"
                    oninput="updateAll()"
                  />
                  <span id="masValue" class="fw-bold">16</span>
                </div>
              </div>

              <!-- Chart -->
              <div class="chart-container">
                <canvas id="functionChart"></canvas>
              </div>

              <!-- Image -->
              <div class="canvas-container">
                <canvas id="imageCanvas"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Πάρε το footer και βάλε το αμέσως πριν το τέλος του </body> -->
    <footer class="text-end py-2 px-3 bg-transparent">
      <small style="color: #adb5bd; font-size: 0.75rem">
        © Belistou Maria-Stavroula, Gaintatzis Pavlos 2025
      </small>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.4.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Constants
      const a = 6;
      const ka = 15;
      const kb = 10;
      const s = 0.3;

      let originalImage, functionChart;

      async function loadImage() {
        const img = await fetch("1.jpg")
          .then((r) => r.blob())
          .then((b) => createImageBitmap(b));
        const canvas = document.getElementById("imageCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }

      function updateLabel(id, value, decimals = 0) {
        document.getElementById(id).textContent =
          parseFloat(value).toFixed(decimals);
      }

      function updateImageProcessing() {
        if (!originalImage) return;

        const mAs = +document.getElementById("masSlider").value;
        const kVp = +document.getElementById("kvpSlider").value;

        /* -------- φωτεινότητα από mAs --------
         */
        // brightness: 2 mAs -> φωτεινό (1.5 περίπου), 30 mAs -> σκοτεινό (0.5)
        // 3 mAs → 1.0  |  30 mAs → 0.5  (γραμμικό)
        const brightness = 1 - ((mAs - 3) * 0.5) / 27;

        /* -------- contrast από kVp ----------
     110 kVp → 1.0  (ουδέτερο)
     <110 kVp → >1  (υψηλότερο contrast)
     >110 kVp → <1  (χαμηλότερο contrast)  */
        const contrastFactor = 110 / kVp;

        const canvas = document.getElementById("imageCanvas");
        const ctx = canvas.getContext("2d");
        const img = new ImageData(
          new Uint8ClampedArray(originalImage.data),
          originalImage.width,
          originalImage.height
        );

        for (let i = 0; i < img.data.length; i += 4) {
          // φωτεινότητα
          let r = img.data[i] * brightness;
          let g = img.data[i + 1] * brightness;
          let b = img.data[i + 2] * brightness;

          // contrast γύρω από μεσαίο τόνο 128
          r = (r - 128) * contrastFactor + 128;
          g = (g - 128) * contrastFactor + 128;
          b = (b - 128) * contrastFactor + 128;

          // κλάµπάρουμε
          img.data[i] = Math.min(255, Math.max(0, r));
          img.data[i + 1] = Math.min(255, Math.max(0, g));
          img.data[i + 2] = Math.min(255, Math.max(0, b));
        }
        ctx.putImageData(img, 0, 0);
      }

      function computeData(kvp, mas) {
        const xs = [];
        const ys = [];
        const points = 500;
        for (let i = 0; i <= points; i++) {
          const x = i * (kvp / points);
          let y = 0;
          if (x > 0 && x < kvp) {
            const base = ((0.1 * mas * (kvp - x)) / x) * Math.exp(-a / x);
            const kaTerm =
              ((ka * 0.1 * mas * (kvp - 59.3)) / 59.3) *
              Math.exp(-a / 59.3) *
              Math.exp(-((x - 59.3) ** 2) / (2 * s * s));
            const kbTerm =
              ((kb * 0.1 * mas * (kvp - 67.2)) / 67.2) *
              Math.exp(-a / 67.2) *
              Math.exp(-((x - 67.2) ** 2) / (2 * s * s));
            y = base + kaTerm + kbTerm;
          }
          xs.push(x);
          ys.push(y);
        }
        return { xs, ys };
      }

      function initChart() {
        const ctx = document.getElementById("functionChart").getContext("2d");
        functionChart = new Chart(ctx, {
          type: "line",
          data: {
            datasets: [
              {
                label: "",
                data: [],
                fill: false,
                tension: 0.4,
                pointRadius: 0,
              },
            ],
          },
          options: {
            responsive: true,
            animation: false,
            plugins: {
              title: {
                display: true,
                text: "Φάσμα ακτίνων X",
              },
              legend: { display: false },
            },
            scales: {
              x: {
                type: "linear",
                min: 0,
                max: 130,
                title: { display: true, text: "Ενέργεια (kV)" },
              },
              y: {
                min: 0,
                max: 20,
                title: { display: true, text: "Ένταση (αυθαίρετες μονάδες)" },
              },
            },
          },
        });
      }

      function updateChart() {
        const kvp = +document.getElementById("kvpSlider").value;
        const mas = +document.getElementById("masSlider").value;
        const data = computeData(kvp, mas);
        functionChart.data.datasets[0].data = data.xs.map((x, i) => ({
          x,
          y: data.ys[i],
        }));
        functionChart.update();
      }

      function updateAll() {
        updateLabel("kvpValue", document.getElementById("kvpSlider").value);
        updateLabel("masValue", document.getElementById("masSlider").value);

        updateImageProcessing(); // ← κλήση της νέας συνάρτησης
        updateChart();
      }

      window.addEventListener("load", async () => {
        await loadImage();
        initChart();
        updateAll();
      });
    </script>
  </body>
</html>
